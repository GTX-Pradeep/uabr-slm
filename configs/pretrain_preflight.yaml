# Preflight for data_v2 (1/10 scale): the same 40M model on data_v2/pretrain_preflight, ~105M tokens with every
# fact exposure but ~1/10 of the Wikipedia text. About 30 min on a T4. It answers, before the ~5 h base_v2 run,
# whether question-format recall and a tier-sensitive ANSWER/CALL decision appear at all (scripts/preflight_check.py).
model:
  vocab_size: 12000
  max_seq_len: 512
  n_layers: 8
  d_model: 512
  n_heads: 8
  d_ff: 2048
  dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true
training:
  precision: fp16
  seed: 2026
  micro_batch_size: 32
  grad_accum_steps: 4
  total_steps: 1602           # ~105M tokens / 65,536 tokens per step
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 150
  weight_decay: 0.1
  betas: [0.9, 0.95]
  gradient_clip_norm: 1.0
  checkpoint_every_steps: 500
  validate_every_steps: 250
  log_every_steps: 100
  val_batches: 20
io:
  data_dir: data/processed/pretrain_preflight      # train.bin / val.bin (uint16)
  output_dir: runs/preflight_40m
